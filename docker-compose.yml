services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE=mongo
      - MONGODB_URI=mongodb://mongo:27017/acm-studio
      - PHOTOS_DIR=/data/photos
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      # Supply Gemini API key for intake features
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-low}
    volumes:
      - acm_photos:/data/photos
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  acm_photos:
  mongo_data:
